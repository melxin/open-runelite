name: Open RuneLite - Latest (push)

on:
  push:
    branches:
      - latest

jobs:
  build:
    name: Build and bootstrap
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up JDK 11
        uses: actions/setup-java@v1.4.3
        with:
          java-version: 11

      - name: Assembling
        run: ./gradlew assemble --console=plain

      - name: Building
        run: ./gradlew build --stacktrace -x test -x checkstyleMain --console=plain

      - name: Shaded jar
        run: ./gradlew :client:shadowJar

      - name: Generate checksums.json
        run: |
          FILE_PATH=$(ls /home/runner/work/open-runelite/open-runelite/runelite-client/build/libs/client-*-shaded.jar)
          FILE_NAME=$(basename "$FILE_PATH")
          FILE_SIZE=$(stat -c%s "$FILE_PATH")
          SHA256_HASH=$(sha256sum "$FILE_PATH" | awk '{ print $1 }')
          echo "{\"file_name\": \"$FILE_NAME\", \"sha256\": \"$SHA256_HASH\", \"size\": $FILE_SIZE}" > /home/runner/work/open-runelite/open-runelite/runelite-client/build/libs/checksums.json

      - name: Push to hosting
        run: |
          git clone https://github.com/melxin/open-runelite-hosting.git
          mkdir -p ./open-runelite-hosting/release
          cp /home/runner/work/open-runelite/open-runelite/runelite-client/build/libs/checksums.json ./open-runelite-hosting/release/
          cp /home/runner/work/open-runelite/open-runelite/runelite-client/build/libs/client-*-shaded.jar ./open-runelite-hosting/release/
          cd open-runelite-hosting

          git config --global user.email "melxin@tutamail.com"
          git config --global user.name "Github Actions"
          git add -A
          git commit -m 'Auto release - Client (Latest)'
          git push https://melxin:${{ secrets.REPO_PAT }}@github.com/melxin/open-runelite-hosting.git master

  checkstyleMain:
    name: Checkstyle main
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Set up JDK 11
        uses: actions/setup-java@v1.4.3
        with:
          java-version: 11
      - name: Assembling
        run: ./gradlew assemble --console=plain
      - name: Checking code conventions
        run: ./gradlew checkstyleMain --console=plain